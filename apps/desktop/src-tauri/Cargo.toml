[package]
name = "local-context-engine-desktop"
description = "Tauri desktop shell for Local Context Engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "local_context_engine_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
search-core.workspace = true
search-daemon.workspace = true
windows-files.workspace = true
query-dsl.workspace = true
ranking.workspace = true

serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"

[features]
# Kept so `cargo check` can build the shell without the full bundler stack.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
