[workspace]
resolver = "2"
members = [
    "crates/search-core",
    "crates/query-dsl",
    "crates/ranking",
    "crates/windows-files",
    "crates/windows-processes",
    "crates/windows-apps",
    "crates/windows-services",
    "crates/windows-windows",
    "crates/search-daemon",
    "crates/search-cli",
    "crates/search-mcp",
    "crates/benchmarks",
    "tests",
    "apps/desktop/src-tauri",
]

# The desktop shell pulls in the full Tauri/wry stack. It is a workspace member
# so `cargo fmt --all` and `cargo metadata` see it, but it is excluded from
# `default-members` so `cargo test` / `cargo clippy` stay fast and headless.
default-members = [
    "crates/search-core",
    "crates/query-dsl",
    "crates/ranking",
    "crates/windows-files",
    "crates/windows-processes",
    "crates/windows-apps",
    "crates/windows-services",
    "crates/windows-windows",
    "crates/search-daemon",
    "crates/search-cli",
    "crates/search-mcp",
    "crates/benchmarks",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/styayur/local-context-engine"
homepage = "https://github.com/styayur/local-context-engine"
authors = ["styayur"]
readme = "README.md"

[workspace.dependencies]
search-core = { path = "crates/search-core" }
query-dsl = { path = "crates/query-dsl" }
ranking = { path = "crates/ranking" }
windows-files = { path = "crates/windows-files" }
windows-processes = { path = "crates/windows-processes" }
windows-apps = { path = "crates/windows-apps" }
windows-services = { path = "crates/windows-services" }
windows-windows = { path = "crates/windows-windows" }
search-daemon = { path = "crates/search-daemon" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4.5", features = ["derive", "env"] }
rmp-serde = "1.3"
windows-sys = "0.61"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"