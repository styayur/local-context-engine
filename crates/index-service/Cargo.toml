[package]
name = "index-service"
description = "Privileged Windows service that owns the NTFS MFT and USN journals and serves them over a secured Named Pipe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "lce-index-service"
path = "src/main.rs"

[dependencies]
index-protocol.workspace = true
search-core.workspace = true
search-daemon.workspace = true
windows-files.workspace = true
query-dsl.workspace = true

serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_RemoteDesktop",
  "Win32_System_Services",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
] }
[dev-dependencies]
index-client.workspace = true
