[package]
name = "lce-benchmarks"
description = "Criterion benchmarks for the Local Context Engine search core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "lce_benchmarks"
path = "src/lib.rs"

[[bench]]
name = "file_search"
harness = false

[[bench]]
name = "ranking"
harness = false

[[bench]]
name = "accelerators"
harness = false

[dependencies]
search-core.workspace = true
query-dsl.workspace = true
ranking.workspace = true
windows-files.workspace = true

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }