name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste private file listings — a
        shape like `C:\Users\<me>\Documents\<name>.pdf` is enough.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, or the commit you built from.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2 (build 22631)
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Desktop app
        - CLI (localsearch)
        - MCP server (localsearch-mcp)
        - Build / install
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the query, the compiled DSL from `--explain`, and any error code.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Developer log
      description: Run with `LCE_LOG=debug` (CLI/MCP) or `LCE_LOG=trace` (desktop) and paste the relevant lines.
      render: text
    validations:
      required: false