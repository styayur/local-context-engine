version: 2
updates:
  # Patch updates only. Major and minor bumps of the Rust, Node and Tauri
  # ecosystems land as deliberate pull requests, not as an automatic queue:
  # the workspace pins behaviour (lints, Tauri plugin APIs, Tailwind v4) that a
  # major bump would silently change.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      rust-patches:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      desktop-patches:
        patterns: ["*"]
        update-types: ["patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]