# Native maintenance: 09:00 Asia/Singapore on the 1st and 15th.
# Version updates exclude major releases; security updates retain their independent queue.
# Patch updates only. Major and minor bumps of the Rust, Node and Tauri
# ecosystems land as deliberate pull requests, not as an automatic queue:
# the workspace pins behaviour (lints, Tauri plugin APIs, Tailwind v4) that a
# major bump would silently change.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      rust-patches:
        patterns:
          - "*"
        update-types:
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      desktop-patches:
        patterns:
          - "*"
        update-types:
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: 0 9 1,15 * *
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
